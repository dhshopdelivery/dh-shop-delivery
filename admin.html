<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DH Shop & Delivery — Administration</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{background:#f6f6f6}
    .admin-wrap{max-width:1100px;margin:auto;padding:20px}
    .admin-card{background:#fff;border-radius:18px;padding:22px;margin:15px 0;box-shadow:0 5px 20px rgba(0,0,0,.06)}
    .admin-title{font-size:28px;font-weight:800;margin-bottom:6px}
    .admin-sub{color:#666;margin-bottom:20px}
    .admin-input{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
    .admin-btn{border:0;border-radius:10px;padding:14px 18px;background:#111;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
    .admin-btn.secondary{background:#eee;color:#111}
    .admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .stat{background:#fff;border-radius:15px;padding:18px}
    .stat strong{display:block;font-size:26px;margin-top:5px}
    .hidden{display:none}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    @media(max-width:700px){.admin-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>

<body>

<div class="admin-wrap">

  <div class="admin-card" id="loginBox">
    <div class="admin-title">DH Shop & Delivery</div>
    <div class="admin-sub">Espace administrateur</div>

    <input id="email" class="admin-input" type="email"
           placeholder="Adresse e-mail">

    <input id="password" class="admin-input" type="password"
           placeholder="Mot de passe">

    <button id="loginBtn" class="admin-btn">
      Se connecter
    </button>

    <p id="loginMessage"></p>
  </div>


  <div id="dashboard" class="hidden">

    <div class="admin-card">
      <div class="topbar">
        <div>
          <div class="admin-title">Tableau de bord</div>
          <div class="admin-sub">
            Gestion de DH Shop & Delivery
          </div>
        </div>

        <button id="logoutBtn" class="admin-btn secondary">
          Se déconnecter
        </button>
      </div>
    </div>


    <div class="admin-grid">
      <div class="stat">
        Produits
        <strong id="productCount">0</strong>
      </div>

      <div class="stat">
        Commandes
        <strong id="orderCount">0</strong>
      </div>

      <div class="stat">
        Produits disponibles
        <strong id="availableCount">0</strong>
      </div>

      <div class="stat">
        Ruptures
        <strong id="outCount">0</strong>
      </div>
    </div>


    <div class="admin-card">
      <h2>📦 Produits</h2>

      <button class="admin-btn" onclick="alert('Gestion des produits — étape suivante')">
        Ajouter / gérer les produits
      </button>
    </div>


    <div class="admin-card">
      <h2>🛒 Commandes</h2>

      <button class="admin-btn" onclick="alert('Gestion des commandes — étape suivante')">
        Voir les commandes
      </button>
    </div>


    <div class="admin-card">
      <h2>⚙️ Paramètres</h2>

      <p>Nom de la boutique : <strong>DH Shop & Delivery</strong></p>
      <p>Paiement : <strong>À la livraison</strong></p>
      <p>WhatsApp : <strong>22792617092</strong></p>
    </div>

  </div>

</div>

<script src="admin.js"></script>

</body>
    </html>
